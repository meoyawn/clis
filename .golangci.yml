version: '2'

run:
  timeout: 5m
  modules-download-mode: readonly
  # Moon can launch several module checks; queue them on the shared lint cache.
  allow-serial-runners: true

linters:
  default: standard
  settings:
    staticcheck:
      # Keep correctness checks; optional editor quick-fixes aren't CI failures.
      checks:
        - all
        - '-ST1000'
        - '-ST1003'
        - '-ST1016'
        - '-ST1020'
        - '-ST1021'
        - '-ST1022'
        - '-QF*'
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Service names are proper nouns in user-facing diagnostics.
      - linters: [staticcheck]
        text: 'ST1005:'
        source: 'fmt\.Errorf\("(Avito|BRIS|LinkedIn|Megastroy|Ozon|Planeta)\b'

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
